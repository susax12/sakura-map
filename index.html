<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桜マップ | SAKURA DRONE PROJECT — DRONE ENTERTAINMENT</title>
<meta name="description" content="全国の名桜をドローンで4K空撮。日本地図から撮影地を選んで桜の空撮映像を視聴できる、桜ドローンプロジェクトのマップ。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />

<style>
:root{
  --font-display:"Shippori Mincho B1",serif;
  --font-ui:"Zen Kaku Gothic New",system-ui,sans-serif;
  --sakura:oklch(0.75 0.085 5);
  --sakura-deep:oklch(0.6 0.135 9);
  --sakura-ink:oklch(0.5 0.13 10);
  --sakura-wash:oklch(0.93 0.03 4);
  --paper:oklch(0.985 0.008 78);
  --paper-2:oklch(0.962 0.012 72);
  --ink:oklch(0.27 0.014 40);
  --ink-soft:oklch(0.46 0.012 40);
  --ink-faint:oklch(0.62 0.01 40);
  --line:oklch(0.9 0.008 60);
  --line-soft:oklch(0.93 0.006 60);
  --chrome-bg:rgba(255,252,248,0.84);
  --chrome-fg:var(--ink);
  --chrome-line:oklch(0.9 0.01 40 / 0.7);
  --map-filter:saturate(0.6) brightness(1.05) contrast(0.95) sepia(0.04);
  --shadow-card:0 1px 2px rgba(40,30,35,.05),0 8px 28px -10px rgba(60,30,45,.22);
  --shadow-pop:0 2px 4px rgba(40,30,35,.08),0 20px 50px -16px rgba(70,25,50,.32);
  --radius:16px; --radius-sm:11px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;font-family:var(--font-ui);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
#map{position:fixed;inset:0;background:var(--paper-2);z-index:0;}
.leaflet-tile-pane{filter:var(--map-filter);transition:filter .5s ease;}
.leaflet-container{background:var(--paper-2);font-family:var(--font-ui);}
.leaflet-container a{color:var(--sakura-deep);}
.leaflet-div-icon{background:transparent;border:none;}
.cl-wrap,.pin-wrap{background:transparent!important;border:none!important;}

/* chrome */
.chrome{position:fixed;inset:0;pointer-events:none;z-index:500;}
.chrome>*{pointer-events:auto;}
.topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:18px;padding:11px 18px;background:var(--chrome-bg);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--chrome-line);border-radius:var(--radius);box-shadow:var(--shadow-card);color:var(--chrome-fg);}
.brand{display:flex;align-items:center;flex-shrink:0;text-decoration:none;}
.brand-logo{height:26px;width:auto;display:block;}
.title-block{border-left:1px solid var(--chrome-line);padding-left:18px;min-width:0;flex:1;}
.title-main{display:flex;align-items:baseline;gap:10px;font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.1;letter-spacing:.04em;}
.title-petal{color:var(--sakura-deep);font-size:15px;}
.title-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.count-block{flex-shrink:0;text-align:right;line-height:1;}
.count-num{font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--sakura-deep);letter-spacing:.01em;}
.count-label{font-size:9.5px;letter-spacing:.24em;color:var(--ink-faint);margin-top:5px;font-weight:600;}

/* filter bar */
.filterbar{position:absolute;top:86px;left:14px;right:14px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;}
.region-scroll{display:flex;gap:7px;align-items:center;overflow-x:auto;overflow-y:hidden;padding:3px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.region-scroll::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--chrome-fg);background:var(--chrome-bg);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--chrome-line);border-radius:999px;padding:8px 16px;cursor:pointer;transition:all .18s ease;white-space:nowrap;box-shadow:var(--shadow-card);display:inline-flex;align-items:center;gap:7px;}
.chip:hover{transform:translateY(-1px);border-color:var(--sakura);}
.chip.active{background:var(--sakura-deep);color:#fff;border-color:var(--sakura-deep);}
.chip .chip-count{font-size:10.5px;font-weight:700;opacity:.62;font-variant-numeric:tabular-nums;}
.chip.active .chip-count{opacity:.78;}
.filter-spacer{flex:1;min-width:8px;}
.tools{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.search{display:flex;align-items:center;gap:8px;background:var(--chrome-bg);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--chrome-line);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-card);transition:all .18s ease;width:184px;}
.search:focus-within{border-color:var(--sakura);width:224px;}
.search svg{width:15px;height:15px;color:var(--ink-faint);flex-shrink:0;}
.search input{border:none;background:none;outline:none;font-family:var(--font-ui);font-size:13px;color:var(--chrome-fg);width:100%;}
.search input::placeholder{color:var(--ink-faint);}
.type-select{position:relative;flex-shrink:0;}
.type-btn{display:flex;align-items:center;gap:8px;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--chrome-fg);background:var(--chrome-bg);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--chrome-line);border-radius:999px;padding:8px 13px 8px 15px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-card);transition:all .18s ease;}
.type-btn:hover{border-color:var(--sakura);}
.type-btn.has-value{background:var(--sakura-wash);border-color:var(--sakura);color:var(--sakura-ink);}
.type-btn .caret{width:11px;height:11px;opacity:.6;transition:transform .2s;}
.type-select.open .caret{transform:rotate(180deg);}
.type-menu[hidden]{display:none;}
.type-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--chrome-bg);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--chrome-line);border-radius:14px;box-shadow:var(--shadow-pop);padding:7px;min-width:204px;display:flex;flex-direction:column;gap:2px;z-index:30;animation:pop .16s ease;}
@keyframes pop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.type-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;font-weight:500;color:var(--chrome-fg);padding:9px 12px;border-radius:9px;cursor:pointer;transition:background .14s;}
.type-opt:hover{background:var(--paper-2);}
.type-opt.sel{color:var(--sakura-deep);font-weight:700;}
.type-opt .dot{width:8px;height:8px;border-radius:50%;background:var(--sakura);opacity:0;flex-shrink:0;}
.type-opt.sel .dot{opacity:1;}
.type-opt .opt-left{display:flex;align-items:center;gap:8px;}
.type-opt .opt-count{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.clear-filters[hidden]{display:none;}
.clear-filters{flex-shrink:0;font-size:12px;font-weight:600;color:var(--sakura-ink);background:none;border:none;cursor:pointer;padding:8px 6px;letter-spacing:.03em;display:inline-flex;align-items:center;gap:5px;}
.clear-filters:hover{text-decoration:underline;}

/* zoom + list */
.zoomctl{position:absolute;left:16px;bottom:84px;display:flex;flex-direction:column;background:var(--chrome-bg);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--chrome-line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow-card);}
.zoomctl button{width:40px;height:40px;border:none;background:none;color:var(--chrome-fg);font-size:19px;cursor:pointer;display:grid;place-items:center;transition:background .14s;font-family:var(--font-ui);}
.zoomctl button:hover{background:var(--paper-2);color:var(--sakura-deep);}
.zoomctl button:first-child{border-bottom:1px solid var(--chrome-line);}
.list-toggle{position:absolute;left:16px;bottom:22px;display:flex;align-items:center;gap:9px;font-family:var(--font-ui);font-size:13.5px;font-weight:600;letter-spacing:.04em;color:var(--chrome-fg);background:var(--chrome-bg);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--chrome-line);border-radius:999px;padding:11px 18px 11px 16px;cursor:pointer;box-shadow:var(--shadow-card);transition:all .18s ease;}
.list-toggle:hover{transform:translateY(-1px);border-color:var(--sakura);}
.list-toggle svg{width:16px;height:16px;color:var(--sakura-deep);}

/* petals */
.petal-layer{position:fixed;inset:0;z-index:450;pointer-events:none;overflow:hidden;}
.petal{position:absolute;top:0;background:radial-gradient(circle at 68% 30%,oklch(0.9 0.05 6 / 0.92),oklch(0.8 0.095 7 / 0.85));border-radius:100% 0 100% 0;animation-name:petalfall;animation-timing-function:ease-in-out;animation-iteration-count:infinite;will-change:transform;}
@keyframes petalfall{0%{transform:translate(0,-14vh) rotate(0);}25%{transform:translate(var(--sway),26vh) rotate(95deg);}50%{transform:translate(0,56vh) rotate(185deg);}75%{transform:translate(calc(var(--sway) * -1),84vh) rotate(280deg);}100%{transform:translate(0,114vh) rotate(370deg);}}
@media (prefers-reduced-motion:reduce){.petal-layer{display:none;}}

/* markers */
.cl{display:grid;place-items:center;cursor:pointer;}
.cl-ring{position:relative;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 50% 42%,oklch(0.8 0.1 5 / 0.55),oklch(0.74 0.12 6 / 0.3) 62%,transparent 72%);}
.cl-core{display:grid;place-items:center;border-radius:50%;background:var(--sakura-deep);color:#fff;font-family:var(--font-ui);font-weight:700;box-shadow:0 4px 14px -3px oklch(0.55 0.16 8 / 0.6),inset 0 0 0 2px rgba(255,255,255,.35);font-variant-numeric:tabular-nums;transition:transform .18s ease;}
.cl:hover .cl-core{transform:scale(1.06);}
.pin{position:relative;cursor:pointer;filter:drop-shadow(0 6px 14px rgba(70,25,50,.28));transition:transform .16s ease;}
.pin:hover{transform:translateY(-3px) scale(1.03);z-index:1000!important;}
.pin-card{width:86px;height:58px;border-radius:11px;overflow:hidden;border:2.5px solid #fff;position:relative;background:var(--paper-2);}
.pin-thumb{position:absolute;inset:0;background-size:cover;background-position:center;}
.pin-pref{position:absolute;left:0;top:0;bottom:0;width:22px;display:grid;place-items:center;background:linear-gradient(90deg,rgba(20,12,18,.62),rgba(20,12,18,.12));color:#fff;font-family:var(--font-display);font-size:10px;font-weight:600;writing-mode:vertical-rl;letter-spacing:.08em;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.pin-badge{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--sakura-deep);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;font-variant-numeric:tabular-nums;}
.pin-petal{position:absolute;top:-9px;left:-7px;font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
.pin-tail{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:9px solid #fff;}
.pin.selected .pin-card{border-color:var(--sakura-deep);box-shadow:0 0 0 3px var(--sakura-wash);}
.pin.selected{transform:translateY(-3px) scale(1.05);}

/* detail panel */
.panel{position:absolute;top:0;right:0;bottom:0;width:420px;background:var(--paper);border-left:1px solid var(--line);box-shadow:var(--shadow-pop);z-index:700;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);overflow:hidden;}
.panel.open{transform:none;}
.panel-media{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex-shrink:0;overflow:hidden;}
.panel-media .media-img{position:absolute;inset:0;background-size:cover;background-position:center;}
.panel-media .media-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32) 0%,transparent 32%,transparent 55%,rgba(0,0,0,.55) 100%);}
.media-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.6);display:grid;place-items:center;cursor:pointer;transition:all .2s ease;}
.media-play:hover{background:var(--sakura-deep);border-color:var(--sakura-deep);transform:translate(-50%,-50%) scale(1.08);}
.media-play svg{width:24px;height:24px;color:#fff;margin-left:3px;}
.media-dur{position:absolute;right:12px;bottom:11px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;letter-spacing:.03em;}
.panel-media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.panel-close{position:absolute;top:12px;right:12px;z-index:4;width:34px;height:34px;border-radius:50%;background:rgba(20,16,20,.5);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .16s;}
.panel-close:hover{background:var(--sakura-deep);}
.panel-close svg{width:16px;height:16px;}
.panel-body{padding:22px 24px 28px;overflow-y:auto;flex:1;}
.panel-body::-webkit-scrollbar{width:8px;}
.panel-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.panel-tags{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.tag-pref{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:#fff;background:var(--sakura-deep);padding:4px 11px;border-radius:999px;}
.tag-type{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--sakura-ink);background:var(--sakura-wash);padding:4px 11px;border-radius:999px;border:1px solid var(--sakura);}
.panel-title{font-family:var(--font-display);font-weight:700;font-size:25px;line-height:1.28;letter-spacing:.01em;color:var(--ink);margin:0 0 6px;text-wrap:pretty;}
.panel-loc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
.panel-loc svg{width:14px;height:14px;color:var(--sakura);}
.panel-meta{display:flex;gap:22px;padding:14px 0 18px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);margin-bottom:18px;flex-wrap:wrap;}
.meta-item .meta-val{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink);white-space:nowrap;}
.meta-item .meta-lab{font-size:10.5px;color:var(--ink-faint);letter-spacing:.12em;margin-top:3px;font-weight:600;}
.vid-head{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink-faint);margin:4px 0 12px;}
.vid-list{display:flex;flex-direction:column;gap:9px;margin-bottom:22px;}
.vid-row{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:all .16s;}
.vid-row:hover{background:var(--paper-2);}
.vid-row.active{background:var(--sakura-wash);border-color:var(--sakura);}
.vid-thumb{width:92px;height:52px;border-radius:8px;overflow:hidden;position:relative;flex-shrink:0;background:var(--paper-2);}
.vid-thumb .vt-img{position:absolute;inset:0;background-size:cover;background-position:center;}
.vid-thumb .vt-play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.18);}
.vid-thumb .vt-play svg{width:20px;height:20px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
.vid-info{min-width:0;}
.vid-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--sakura-deep);margin-bottom:3px;}
.vid-title{font-size:13px;font-weight:500;color:var(--ink);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.btn-yt{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:#ff0033;color:#fff;font-family:var(--font-ui);font-weight:700;font-size:14.5px;letter-spacing:.03em;border:none;border-radius:12px;cursor:pointer;text-decoration:none;box-shadow:0 8px 22px -8px rgba(255,0,51,.6);transition:transform .16s,box-shadow .16s;}
.btn-yt:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(255,0,51,.7);}
.btn-yt svg{width:22px;height:22px;}
.panel-share{display:flex;gap:8px;margin-top:12px;}
.share-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:all .16s;}
.share-btn:hover{border-color:var(--sakura);color:var(--sakura-ink);}
.share-btn svg{width:15px;height:15px;}

/* list drawer */
.drawer{position:absolute;top:0;left:0;bottom:0;width:372px;background:var(--paper);border-right:1px solid var(--line);box-shadow:var(--shadow-pop);z-index:650;display:flex;flex-direction:column;transform:translateX(-103%);transition:transform .32s cubic-bezier(.22,1,.36,1);}
.drawer.open{transform:none;}
.drawer-head{padding:20px 22px 14px;border-bottom:1px solid var(--line-soft);flex-shrink:0;}
.drawer-title{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.04em;margin-bottom:14px;}
.drawer-close{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:4px;display:grid;place-items:center;}
.drawer-close:hover{color:var(--sakura-deep);}
.drawer-close svg{width:18px;height:18px;}
.drawer-search{display:flex;align-items:center;gap:9px;background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:10px 13px;}
.drawer-search:focus-within{border-color:var(--sakura);}
.drawer-search svg{width:15px;height:15px;color:var(--ink-faint);}
.drawer-search input{border:none;background:none;outline:none;font-family:var(--font-ui);font-size:13.5px;color:var(--ink);width:100%;}
.drawer-search input::placeholder{color:var(--ink-faint);}
.drawer-list{overflow-y:auto;flex:1;padding:8px 12px 16px;}
.drawer-list::-webkit-scrollbar{width:8px;}
.drawer-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.region-head{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--sakura-deep);padding:16px 10px 8px;position:sticky;top:0;background:var(--paper);z-index:2;}
.region-head:first-child{padding-top:6px;}
.region-head .rh-count{color:var(--ink-faint);font-weight:600;margin-left:6px;}
.list-item{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .14s;border:1px solid transparent;}
.list-item:hover{background:var(--paper-2);}
.list-item.active{background:var(--sakura-wash);border-color:var(--sakura);}
.li-thumb{width:64px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;position:relative;background:var(--paper-2);}
.li-thumb .lt-img{position:absolute;inset:0;background-size:cover;background-position:center;}
.li-badge{position:absolute;right:3px;bottom:3px;font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.62);padding:1px 5px;border-radius:5px;}
.li-body{min-width:0;flex:1;}
.li-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.li-meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
.li-loc{font-size:11px;color:var(--ink-faint);}
.li-type{font-size:10px;font-weight:600;color:var(--sakura-ink);background:var(--sakura-wash);padding:1px 7px;border-radius:999px;white-space:nowrap;}
.list-empty{text-align:center;padding:50px 20px;color:var(--ink-faint);font-size:13px;}
.list-empty .le-petal{font-size:30px;display:block;margin-bottom:12px;opacity:.6;}
.scrim{position:absolute;inset:0;background:rgba(20,14,18,.28);z-index:640;opacity:0;pointer-events:none;transition:opacity .3s;-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);}
.scrim.show{opacity:1;pointer-events:auto;}

@media (max-width:760px){
  .topbar{top:10px;left:10px;right:10px;gap:12px;padding:9px 14px;}
  .title-block{padding-left:12px;}
  .title-main{font-size:16px;}
  .title-sub{display:none;}
  .count-num{font-size:20px;}

/* ===== helpers ===== */
const thumb = (id) => `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
const spotThumb = (s) => thumb(s.videos[0].ytId);
const prefShort = (p) => p.replace(/[県都府道]$/,'');
const ICON = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.4" fill="currentColor"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  yt:'<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none"><path d="M9.5 14.5l5-5M8 12l-2 2a3.5 3.5 0 105 5l2-2M16 12l2-2a3.5 3.5 0 10-5-5l-2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2.4" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="6" r="2.4" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="2.4" stroke="currentColor" stroke-width="2"/><path d="M8 11l8-4M8 13l8 4" stroke="currentColor" stroke-width="2"/></svg>'
};
const esc = (s) => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Leaflet map engine ===== */
const SakuraMap = (function(){
  let map, cluster, markersById={}, selectedId=null, onSelect=null, allSpots=[];
  function clusterHtml(count){
    const size = count<6?44:count<16?54:count<36?66:78;
    const core = Math.round(size*0.62);
    const fs = count<36?16:18;
    return {html:`<div class="cl"><div class="cl-ring" style="width:${size}px;height:${size}px"><div class="cl-core" style="width:${core}px;height:${core}px;font-size:${fs}px">${count}</div></div></div>`, size};
  }
  function pinIcon(spot, selected){
    const multi = spot.videos.length>1;
    const html = `<div class="pin ${selected?'selected':''}">`+
      `<span class="pin-petal">🌸</span>`+
      (multi?`<span class="pin-badge">${spot.videos.length}</span>`:'')+
      `<div class="pin-card"><div class="pin-thumb" style="background-image:url(${thumb(spot.videos[0].ytId)})"></div>`+
      `<div class="pin-pref">${esc(prefShort(spot.pref))}</div></div>`+
      `<div class="pin-tail"></div></div>`;
    return L.divIcon({html, className:'pin-wrap', iconSize:[86,67], iconAnchor:[43,67], popupAnchor:[0,-64]});
  }
  function init(opts){
    onSelect=opts.onSelect;
    map=L.map('map',{center:[37.6,137.5],zoom:5,minZoom:4,maxZoom:16,zoomControl:false,worldCopyJump:false,maxBounds:L.latLngBounds([20,118],[48,154]),maxBoundsViscosity:0.6});
    map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{attribution:'地理院タイル',maxZoom:18}).addTo(map);
    cluster=L.markerClusterGroup({maxClusterRadius:58,showCoverageOnHover:false,spiderfyOnMaxZoom:true,chunkedLoading:true,
      iconCreateFunction:c=>{const i=clusterHtml(c.getChildCount());return L.divIcon({html:i.html,className:'cl-wrap',iconSize:[i.size,i.size]});}});
    map.addLayer(cluster);
  }
  function render(spots){
    cluster.clearLayers(); markersById={};
    spots.forEach(spot=>{
      const m=L.marker([spot.lat,spot.lng],{icon:pinIcon(spot,spot.id===selectedId),riseOnHover:true});
      m._spot=spot; m.on('click',()=>onSelect&&onSelect(spot.id));
      markersById[spot.id]=m; cluster.addLayer(m);
    });
  }
  function setData(spots){allSpots=spots;render(spots);}
  function select(id, fly){
    const prev=markersById[selectedId]; if(prev) prev.setIcon(pinIcon(prev._spot,false));
    selectedId=id; const m=markersById[id];
    if(m){ m.setIcon(pinIcon(m._spot,true));
      if(fly){const tz=Math.max(map.getZoom(),9);cluster.zoomToShowLayer(m,()=>map.setView(m.getLatLng(),Math.max(map.getZoom(),tz),{animate:true}));}
    } else if(fly){const s=allSpots.find(x=>x.id===id); if(s) map.flyTo([s.lat,s.lng],10,{duration:.8});}
  }
  function clearSelection(){const prev=markersById[selectedId]; if(prev) prev.setIcon(pinIcon(prev._spot,false)); selectedId=null;}
  function fitRegion(spots){
    if(!spots.length){map.flyTo([37.6,137.5],5,{duration:.7});return;}
    map.flyToBounds(L.latLngBounds(spots.map(s=>[s.lat,s.lng])),{padding:[90,90],maxZoom:9,duration:.7});
  }
  return {init,setData,select,clearSelection,fitRegion,zoomIn:()=>map.zoomIn(),zoomOut:()=>map.zoomOut()};
})();

/* ===== state ===== */
let state={region:'all',type:null,query:'',selectedId:null,panelOpen:false,drawerOpen:false,vid:0,playing:false};
const isMobile=()=>matchMedia('(max-width:760px)').matches;
const $=id=>document.getElementById(id);

const matchRegion=s=>state.region==='all'||s.region===state.region;
const matchType=s=>!state.type||s.type===state.type;
const matchQuery=s=>{const q=state.query.trim().toLowerCase();return !q||(s.name+s.pref+s.city+s.videos.map(v=>v.title).join('')).toLowerCase().includes(q);};
const filtered=()=>SPOTS.filter(s=>matchRegion(s)&&matchType(s)&&matchQuery(s));

/* ===== render: header count, chips, type menu ===== */
function renderCount(n){$('countNum').textContent=n;}
function renderChips(){
  const counts={}; SPOTS.filter(s=>matchType(s)&&matchQuery(s)).forEach(s=>counts[s.region]=(counts[s.region]||0)+1);
  $('chips').innerHTML = REGIONS.map(r=>{
    const c = r.id!=='all'&&counts[r.id]!=null ? `<span class="chip-count">${counts[r.id]}</span>`:'';
    return `<button class="chip ${state.region===r.id?'active':''}" data-r="${r.id}">${esc(r.label)}${c}</button>`;
  }).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>onRegion(b.dataset.r));
}
function renderTypeMenu(){
  const counts={}; SPOTS.filter(s=>matchRegion(s)&&matchQuery(s)).forEach(s=>counts[s.type]=(counts[s.type]||0)+1);
  const opt=(id,label,count)=>`<div class="type-opt ${state.type===id?'sel':''}" data-t="${id==null?'':id}"><span class="opt-left"><span class="dot"></span>${esc(label)}</span>${count!=null?`<span class="opt-count">${count}</span>`:''}</div>`;
  let html=opt(null,'すべての種類',null);
  html+=SAKURA_TYPES.map(t=>opt(t.id,t.label,counts[t.id]||0)).join('');
  $('typeMenu').innerHTML=html;
  $('typeMenu').querySelectorAll('.type-opt').forEach(o=>o.onclick=()=>{onType(o.dataset.t||null);closeTypeMenu();});
  $('typeBtn').classList.toggle('has-value',!!state.type);
  $('typeLabel').textContent = state.type?TYPE_LABEL[state.type]:'桜の種類';
}
function renderClear(){
  const any=!!state.type||!!state.query.trim()||state.region!=='all';
  const b=$('clearBtn'); b.hidden=!any;
  b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" style="width:12px;height:12px"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>絞り込み解除`;
}

/* ===== drawer list ===== */
function renderDrawer(){
  const q=$('drawerSearch').value.trim().toLowerCase();
  let spots=filtered();
  if(q) spots=spots.filter(s=>(s.name+s.pref+s.city).toLowerCase().includes(q));
  const order=REGIONS.filter(r=>r.id!=='all').map(r=>r.id);
  const g={}; spots.forEach(s=>{(g[s.region]=g[s.region]||[]).push(s);});
  const groups=order.filter(id=>g[id]).map(id=>({id,label:REGION_LABEL[id],items:g[id]}));
  const box=$('drawerList');
  if(!groups.length){box.innerHTML=`<div class="list-empty"><span class="le-petal">❀</span>該当する名所が見つかりません</div>`;return;}
  box.innerHTML=groups.map(grp=>
    `<div class="region-head">${esc(grp.label)}<span class="rh-count">${grp.items.length}</span></div>`+
    grp.items.map(s=>
      `<div class="list-item ${s.id===state.selectedId?'active':''}" data-id="${s.id}">`+
      `<div class="li-thumb"><div class="lt-img" style="background-image:url(${spotThumb(s)})"></div>${s.videos.length>1?`<span class="li-badge">${s.videos.length}本</span>`:''}</div>`+
      `<div class="li-body"><div class="li-name">${esc(s.name)}</div><div class="li-meta"><span class="li-loc">${esc(s.pref)} ${esc(s.city)}</span><span class="li-type">${esc(TYPE_LABEL[s.type])}</span></div></div>`+
      `</div>`).join('')
  ).join('');
  box.querySelectorAll('.list-item').forEach(el=>el.onclick=()=>handleSelect(el.dataset.id));
}

/* ===== detail panel ===== */
function renderPanel(){
  const s=SPOTS.find(x=>x.id===state.selectedId);
  const panel=$('panel');
  panel.className='panel'+(state.panelOpen?' open':'');
  if(!s){panel.innerHTML='';return;}
  const v=s.videos[state.vid]||s.videos[0];
  const media = state.playing
    ? `<iframe src="https://www.youtube-nocookie.com/embed/${v.ytId}?autoplay=1&rel=0" title="${esc(v.title)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    : `<div class="media-img" style="background-image:url(${thumb(v.ytId)})"></div><div class="media-shade"></div>`+
      `<button class="media-play" id="mediaPlay" aria-label="再生">${ICON.play}</button><span class="media-dur">4K · 空撮</span>`;
  const vlist = s.videos.length>1
    ? `<div class="vid-head">この名所の動画 (${s.videos.length})</div><div class="vid-list">`+
      s.videos.map((vv,i)=>`<div class="vid-row ${i===state.vid?'active':''}" data-i="${i}"><div class="vid-thumb"><div class="vt-img" style="background-image:url(${thumb(vv.ytId)})"></div><div class="vt-play">${ICON.play}</div></div><div class="vid-info"><div class="vid-label">${esc(vv.label)}</div><div class="vid-title">${esc(vv.title)}</div></div></div>`).join('')+
      `</div>`
    : '';
  panel.innerHTML=
    `<div class="panel-media">${media}<button class="panel-close" id="panelClose" aria-label="閉じる">${ICON.close}</button></div>`+
    `<div class="panel-body">`+
    `<div class="panel-tags"><span class="tag-pref">${esc(s.pref)}</span><span class="tag-type">${esc(TYPE_LABEL[s.type])}</span></div>`+
    `<h2 class="panel-title">${esc(s.name)}</h2>`+
    `<div class="panel-loc">${ICON.pin} ${esc(s.pref)} ${esc(s.city)}</div>`+
    `<div class="panel-meta"><div class="meta-item"><div class="meta-val">${s.videos.length}</div><div class="meta-lab">本の動画</div></div><div class="meta-item"><div class="meta-val">4K</div><div class="meta-lab">空撮品質</div></div></div>`+
    vlist+
    `<a class="btn-yt" href="https://www.youtube.com/watch?v=${v.ytId}" target="_blank" rel="noreferrer">${ICON.yt} YouTube で見る</a>`+
    `<div class="panel-share"><button class="share-btn" id="copyBtn">${ICON.link} <span>リンクをコピー</span></button><button class="share-btn" id="shareBtn">${ICON.share} 共有</button></div>`+
    `</div>`;
  const mp=$('mediaPlay'); if(mp) mp.onclick=()=>{state.playing=true;renderPanel();};
  $('panelClose').onclick=closePanel;
  panel.querySelectorAll('.vid-row').forEach(r=>r.onclick=()=>{state.vid=+r.dataset.i;state.playing=false;renderPanel();});
  $('copyBtn').onclick=()=>{const url=`${location.origin}${location.pathname}?spot=${v.ytId}`;navigator.clipboard&&navigator.clipboard.writeText(url);const sp=$('copyBtn').querySelector('span');if(sp){const o=sp.textContent;sp.textContent='コピーしました';setTimeout(()=>sp.textContent=o,1400);}};
  $('shareBtn').onclick=()=>{const url=`${location.origin}${location.pathname}?spot=${v.ytId}`;if(navigator.share)navigator.share({title:s.name,text:`${s.name}｜桜ドローンプロジェクト`,url});else{navigator.clipboard&&navigator.clipboard.writeText(url);}};
}

/* ===== actions ===== */
function refreshChrome(){renderCount(filtered().length);renderChips();renderClear();}
function handleSelect(id){
  state.selectedId=id;state.panelOpen=true;state.vid=0;state.playing=false;
  SakuraMap.select(id,true);
  if(isMobile()){state.drawerOpen=false;syncDrawer();}
  renderPanel();renderDrawer();
}
function closePanel(){state.panelOpen=false;renderPanel();SakuraMap.clearSelection();setTimeout(()=>{state.selectedId=null;renderDrawer();},200);}
function onRegion(id){
  state.region=id;
  const next=SPOTS.filter(s=>(id==='all'||s.region===id)&&matchType(s)&&matchQuery(s));
  SakuraMap.setData(filtered()); if(state.selectedId)SakuraMap.select(state.selectedId,false);
  SakuraMap.fitRegion(next); refreshChrome();renderDrawer();
}
function onType(t){
  state.type=t;
  SakuraMap.setData(filtered()); if(state.selectedId)SakuraMap.select(state.selectedId,false);
  refreshChrome();renderTypeMenu();renderDrawer();
}
function onQuery(q){
  state.query=q;
  SakuraMap.setData(filtered()); if(state.selectedId)SakuraMap.select(state.selectedId,false);
  refreshChrome();renderTypeMenu();renderDrawer();
}
function clearAll(){state.region='all';state.type=null;state.query='';$('search').value='';SakuraMap.setData(SPOTS);SakuraMap.fitRegion(SPOTS);refreshChrome();renderTypeMenu();renderDrawer();}
function syncDrawer(){$('drawer').className='drawer'+(state.drawerOpen?' open':'');$('scrim').className='scrim'+(state.drawerOpen&&isMobile()?' show':'');}
function openTypeMenu(){$('typeSelect').classList.add('open');$('typeMenu').hidden=false;}
function closeTypeMenu(){$('typeSelect').classList.remove('open');$('typeMenu').hidden=true;}

/* ===== petals ===== */
function buildPetals(){
  const box=$('petals');let h='';
  for(let i=0;i<16;i++){
    const left=Math.random()*100,delay=-Math.random()*16,dur=13+Math.random()*12,size=7+Math.random()*8,sway=30+Math.random()*50,op=.35+Math.random()*.4;
    h+=`<span class="petal" style="left:${left}%;width:${size}px;height:${size*0.86}px;animation-delay:${delay}s;animation-duration:${dur}s;opacity:${op};--sway:${sway}px"></span>`;
  }
  box.innerHTML=h;
}

/* ===== wire events ===== */
$('zin').onclick=()=>SakuraMap.zoomIn();
$('zout').onclick=()=>SakuraMap.zoomOut();
$('listToggle').onclick=()=>{state.drawerOpen=!state.drawerOpen;syncDrawer();};
$('drawerClose').onclick=()=>{state.drawerOpen=false;syncDrawer();};
$('scrim').onclick=()=>{state.drawerOpen=false;syncDrawer();};
$('clearBtn').onclick=clearAll;
$('search').oninput=e=>onQuery(e.target.value);
$('drawerSearch').oninput=renderDrawer;
$('typeBtn').onclick=()=>{$('typeSelect').classList.contains('open')?closeTypeMenu():openTypeMenu();};
document.addEventListener('mousedown',e=>{if(!$('typeSelect').contains(e.target))closeTypeMenu();});

/* ===== boot ===== */
SakuraMap.init({onSelect:handleSelect});
SakuraMap.setData(SPOTS);
buildPetals();
renderChips();renderTypeMenu();renderClear();renderCount(SPOTS.length);renderDrawer();

const deepId=new URLSearchParams(location.search).get('spot');
const deepSpot=deepId?SPOTS.find(s=>s.videos.some(v=>v.ytId===deepId)):null;
if(deepSpot){
  state.selectedId=deepSpot.id;state.panelOpen=true;
  const vi=deepSpot.videos.findIndex(v=>v.ytId===deepId);state.vid=vi<0?0:vi;
  SakuraMap.select(deepSpot.id,true);renderPanel();renderDrawer();
}
</script>
</body>
