<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

    --brand-red: #DA0000;
    --ink: #222222;
    --bg: #ffffff;
    --bg-alt: #F6F6F6;
    --bg-dark: #1a1a1a;
    --muted: #8c8f9a;
    --line: #e7e7ea;
    /* 桜テーマ (ピン・装飾) */
    --sakura: #f7a8c4;
    --sakura-deep: #e26d9b;

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--jp); color: var(--ink); }
  body { overflow: hidden; }

  /* ===== Header ===== */
  header {
    position: absolute; top: 0; left: 0; right: 0; height: 64px; z-index: 1100;
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
    background: var(--bg-dark); color: #fff;
  }
  header .brand { display: flex; align-items: center; height: 100%; }
  header .logo-img { height: 24px; width: auto; display: block; }
  header .page-title {
    display: flex; flex-direction: column; line-height: 1.25;
    border-left: 1px solid #3a3a3a; padding-left: 16px;
  }
  header .page-title .pt-main { font-size: 14px; font-weight: 700; }
  header .page-title .pt-sub { font-size: 11px; color: #9a9aa0; letter-spacing: .03em; }
  header .count { margin-left: auto; font-family: var(--en); font-size: 12px; color: #9a9aa0; letter-spacing: .05em; }
  header .count b { color: #fff; font-size: 18px; font-weight: 900; }

  /* ===== Region filter ===== */
  #filters {
    position: absolute; top: 76px; left: 12px; z-index: 1050;
    display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px);
  }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 500; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); transition: .12s; user-select: none;
  }
  .chip:hover { border-color: var(--brand-red); }
  .chip.active { background: var(--brand-red); color: #fff; border-color: var(--brand-red); }

  /* ===== Map ===== */
  #map { position: absolute; inset: 0; top: 64px; z-index: 1; background: #eaf0f2; }

  .sakura-thumb { width: 48px; height: 48px; position: relative; cursor: pointer; }
  .sakura-thumb img {
    width: 48px; height: 48px; object-fit: cover; border-radius: 10px; display: block;
    border: 3px solid var(--sakura-deep); background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.35);
    transition: transform .12s, border-color .12s;
  }
  .sakura-thumb:hover img { transform: scale(1.1); border-color: var(--brand-red); }
  .sakura-thumb::after {
    content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 8px solid var(--sakura-deep);
  }
  .sakura-thumb .bud {
    position: absolute; top: -9px; left: -7px; font-size: 15px; line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.3));
  }
  .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background: rgba(226,109,155,.35); }
  .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background: var(--sakura-deep); color:#fff; font-weight:700; }

  /* ===== Detail panel ===== */
  #panel {
    position: absolute; top: 64px; right: 0; bottom: 0; width: var(--panel-w); z-index: 1080;
    background: #fff; box-shadow: -4px 0 28px rgba(0,0,0,.14);
    transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #panel.open { transform: translateX(0); }
  #panel .close {
    position: absolute; top: 10px; right: 12px; z-index: 2; width: 32px; height: 32px;
    border: none; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; font-size: 18px; cursor: pointer;
  }
  .video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #panel .body { padding: 20px 22px 32px; }
  #panel .pref {
    display:inline-block; font-family: var(--en); font-size:11px; color:#fff; font-weight:700;

  #panel .meta { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  #panel .project-tag {
    display:inline-block; font-family:var(--en); font-size:10.5px; letter-spacing:.06em; color:var(--sakura-deep);
    background:#fdeef4; border:1px solid #f6d3e1; padding:3px 9px; border-radius:6px; margin-top:6px;

  #panel .yt-link {
    display:inline-flex; align-items:center; gap:6px; margin-top:18px; font-size:13px; color:#fff;
    background:var(--brand-red); text-decoration:none; font-weight:700; padding:10px 16px; border-radius:8px;

  #panel .yt-link:hover { background:#b80000; }
  /* 動画切替ストリップ (1スポット複数動画) */
  #panel .switch { display:none; gap:8px; margin:4px 0 14px; overflow-x:auto; padding-bottom:4px; }
  #panel .switch.show { display:flex; }
  #panel .switch .vthumb {
    flex:0 0 auto; width:104px; cursor:pointer; border-radius:8px; overflow:hidden;
    border:2px solid transparent; background:#000; transition:border-color .12s;

  #panel .switch .vthumb.active { border-color:var(--brand-red); }
  #panel .switch .vthumb:hover { border-color:var(--sakura-deep); }
  #panel .switch .vthumb img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }

    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .sakura-thumb .vcount {
    position:absolute; top:-8px; right:-8px; min-width:18px; height:18px; padding:0 4px;
    background:var(--brand-red); color:#fff; font-size:11px; font-weight:700; line-height:18px;
    text-align:center; border-radius:9px; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3);

  #listBtn {
    position: absolute; bottom: 20px; left: 12px; z-index: 1050;
    border: none; background: var(--bg-dark); color: #fff; border-radius: 10px;
    padding: 10px 16px; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.2);

  #list {
    position: absolute; bottom: 64px; left: 12px; z-index: 1060; width: 300px; max-height: 54vh;
    overflow-y: auto; background: #fff; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.2);

  .list-group { font-family:var(--en); font-size:10.5px; letter-spacing:.08em; color:var(--muted); padding:8px 11px 3px; }
  .list-item { padding: 8px 11px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }

  .list-item .li-pref { font-size: 11px; color: var(--muted); }

  @media (max-width: 720px) {

    #panel { top: auto; bottom: 0; height: 80%; border-radius: 18px 18px 0 0; transform: translateY(100%); }
    #panel.open { transform: translateY(0); }
    #list { width: calc(100% - 24px); }
  }

  { 'EXa-A-sdij4':'2026 潤野', 'YP5V1NPHibo':'2023', 'Knjr3sgefEM':'新種発見' },           // 和歌山・古座川クマノザクラ
  { 'N-9XvquJ3wE':'ロングショット', 'kl_HC089y74':'2023', 'Xj2e3dGwI9g':'別ver' },          // 広島・佐木島塔ノ峰千本桜
  { 'XtRtGKpdzlE':'2023', 'nWGfWjWWRWo':'別ver' },                                       // 香川・紫雲出山
  { 'R2dbiQOO6sI':'ひょうたん桜', 'hXY0Q4fmlFM':'仁淀ブルー' },                             // 高知・仁淀ブルー
];

/* ===== スポット(グループ)を構築 ===== */
function buildGroups() {
  const byId = {}; SPOTS.forEach(s => byId[s.id] = s);
  const consumed = new Set();
  const groups = [];
  MERGE.forEach(m => {
    const ids = Object.keys(m).filter(id => byId[id]);
    if (!ids.length) return;
    const rep = byId[ids[0]];
    const members = ids.map(id => byId[id]);
    members.forEach(s => consumed.add(s.id));
    groups.push({
      id: rep.id, name: rep.name, pref: rep.pref, city: rep.city, region: rep.region,
      lat: members.reduce((a,s)=>a+s.lat,0)/members.length,
      lng: members.reduce((a,s)=>a+s.lng,0)/members.length,
      videos: ids.map(id => ({ id, label: m[id] }))
    });
  });
  SPOTS.forEach(s => {
    if (consumed.has(s.id)) return;
    groups.push({ ...s, videos: [{ id: s.id, label: s.name }] });
  });
  return groups;
}
const GROUPS = buildGroups();
const groupByVideo = {};
GROUPS.forEach(g => g.videos.forEach(v => groupByVideo[v.id] = g));

function thumbIcon(g) {
  const badge = g.videos.length > 1 ? `<span class="vcount">${g.videos.length}</span>` : '';
  return L.divIcon({
    className: '',
    html: `<div class="sakura-thumb"><span class="bud">🌸</span>${badge}`
        + `<img loading="lazy" src="https://img.youtube.com/vi/${g.id}/default.jpg" alt=""></div>`,
    iconSize: [48,48], iconAnchor: [24,55], popupAnchor: [0,-50]
  });
}

const cluster = L.markerClusterGroup({ maxClusterRadius: 55, showCoverageOnHover: false });
let activeRegion = 'all';

function buildMarkers(fit) {
  cluster.clearLayers();
  let n = 0;
  GROUPS.forEach(g => {
    if (activeRegion !== 'all' && g.region !== activeRegion) return;
    const m = L.marker([g.lat, g.lng], { icon: thumbIcon(g), title: g.name });
    m.on('click', () => openGroup(g));
    cluster.addLayer(m);
    n++;
  });
  map.addLayer(cluster);
  document.getElementById('spotCount').textContent = n;
  if (fit && n > 0) map.fitBounds(cluster.getBounds(), { padding: [60, 60], maxZoom: 9 });
}

/* ===== 詳細パネル ===== */
function playVideo(id) {
  document.getElementById('ytFrame').src = `https://www.youtube-nocookie.com/embed/${id}?rel=0&autoplay=1`;
  document.getElementById('pLink').href = `https://youtu.be/${id}`;
  document.querySelectorAll('#pSwitch .vthumb').forEach(el =>
    el.classList.toggle('active', el.dataset.vid === id));
}
function openGroup(g, activeId) {
  document.getElementById('pPref').textContent = g.pref;
  document.getElementById('pTitle').textContent = g.name + (g.videos.length > 1 ? `（動画${g.videos.length}本）` : '');
  document.getElementById('pMeta').textContent = `${g.pref} ${g.city}`;
  const sw = document.getElementById('pSwitch');
  sw.innerHTML = '';
  if (g.videos.length > 1) {
    g.videos.forEach(v => {
      const t = document.createElement('div');
      t.className = 'vthumb'; t.dataset.vid = v.id;
      t.innerHTML = `<img loading="lazy" src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="">`
                  + `<div class="vlabel">${v.label}</div>`;
      t.onclick = () => playVideo(v.id);
      sw.appendChild(t);
    });
    sw.classList.add('show');
  } else {
    sw.classList.remove('show');
  }
  playVideo(activeId && g.videos.some(v=>v.id===activeId) ? activeId : g.videos[0].id);
  document.getElementById('panel').classList.add('open');
}
function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('ytFrame').src = '';
}

/* ===== 地方フィルタ ===== */
function buildFilters() {
  const present = new Set(GROUPS.map(g => g.region));
  const ordered = REGION_ORDER.filter(r => present.has(r));
  const box = document.getElementById('filters');
  const mk = (key, label, active) => {
    const c = document.createElement('div');
    c.className = 'chip' + (active ? ' active' : '');
    c.textContent = label;
    c.onclick = () => {
      activeRegion = key;
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      buildMarkers(true);
    };
    box.appendChild(c);
  };
  mk('all', 'すべて', true);
  ordered.forEach(r => mk(r, r, false));
}

/* ===== 一覧 (地方ごとにグループ) ===== */
function buildList() {
  const box = document.getElementById('list');
  const present = REGION_ORDER.filter(r => GROUPS.some(g => g.region === r));
  present.forEach(r => {
    const head = document.createElement('div');
    head.className = 'list-group'; head.textContent = r;
    box.appendChild(head);
    GROUPS.filter(g => g.region === r).forEach(g => {
      const it = document.createElement('div');
      it.className = 'list-item';
      const tag = g.videos.length > 1 ? ` <span style="color:var(--brand-red);font-weight:700">▶${g.videos.length}</span>` : '';
      it.innerHTML = `<div>${g.name}${tag}</div><div class="li-pref">${g.pref} ${g.city}</div>`;
      it.onclick = () => {
        map.flyTo([g.lat, g.lng], 11, { duration: .8 });
        setTimeout(() => openGroup(g), 750);
        document.getElementById('list').classList.remove('open');
      };
      box.appendChild(it);
    });
  });
  document.getElementById('listBtn').onclick = () =>
    document.getElementById('list').classList.toggle('open');
}

/* ===== 共有用ディープリンク ?spot=<videoId> ===== */
const deepId = new URLSearchParams(location.search).get('spot');
const deepGroup = deepId ? groupByVideo[deepId] : null;

buildFilters();
buildList();
buildMarkers(!deepGroup);   // ディープリンク時は全体フィットせず該当地点へ寄せる

if (deepGroup) {
  map.setView([deepGroup.lat, deepGroup.lng], 11);
  setTimeout(() => openGroup(deepGroup, deepId), 400);
}
</script>
